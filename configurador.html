<style>
/* Layout: una sola columna estrecha tipo móvil; una pregunta por pantalla dentro de una tarjeta de vidrio, barra de progreso arriba, cierre con barra fija hacia WhatsApp. */
:root{
  --f:"Sequel Sans","Sequel Sans Bold","Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#171916;
  --glass:rgba(25,27,21,.62);
  --glass2:rgba(38,42,31,.86);
  --tx:#f4f5f0;
  --mu:#a4a79a;
  --ac:#d5f578;
  --on:#171916;
  --ln:rgba(255,255,255,.11);
  --soft:rgba(213,245,120,.13);
  --glow:rgba(213,245,120,.18);
  --shadow:rgba(0,0,0,.32);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f3f2eb;--glass:rgba(255,255,255,.72);--glass2:rgba(255,255,255,.94);--tx:#12140e;--mu:#555a49;
    --ac:#2f4a00;--on:#ffffff;--ln:rgba(0,0,0,.11);--soft:rgba(47,74,0,.12);--glow:rgba(120,160,0,.2);
    --shadow:rgba(40,50,10,.14);color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f2eb;--glass:rgba(255,255,255,.72);--glass2:rgba(255,255,255,.94);--tx:#12140e;--mu:#555a49;
  --ac:#2f4a00;--on:#ffffff;--ln:rgba(0,0,0,.11);--soft:rgba(47,74,0,.12);--glow:rgba(120,160,0,.2);
  --shadow:rgba(40,50,10,.14);color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.55 var(--f);letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:0 40px;position:relative;isolation:isolate;
}
body.has-bar{padding-block:0 120px}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(55vmax 38vmax at 90% -8%,var(--glow),transparent 62%),
    radial-gradient(48vmax 36vmax at -10% 52%,var(--glow),transparent 62%),
    radial-gradient(40vmax 30vmax at 75% 108%,var(--glow),transparent 62%);
}
.shell{max-width:560px;margin:0 auto;display:grid;gap:18px}
h1,h2,h3{margin:0;line-height:1.08;letter-spacing:-.035em;text-wrap:balance}
h1{font-size:clamp(2rem,8vw,2.9rem);font-weight:800}
h2{font-size:clamp(1.55rem,6vw,2.1rem);font-weight:800}
h3{font-size:1.05rem;font-weight:800}
p{margin:0}
.mu{color:var(--mu)}
:focus-visible{outline:3px solid var(--tx);outline-offset:3px}
.glass{
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  border:1px solid var(--ln);border-radius:24px;box-shadow:0 16px 48px var(--shadow);
}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:18px 0}
.brand{font-weight:800;letter-spacing:-.03em;font-size:1.05rem}
.back{
  font:inherit;font-weight:700;font-size:.9rem;color:var(--mu);background:none;border:0;cursor:pointer;padding:8px 4px;
}
.back[hidden]{display:none}
.prog{height:6px;border-radius:6px;background:var(--ln);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ac);border-radius:6px;transition:width .35s ease}

.card{padding:28px 22px;display:grid;gap:20px;animation:rise .35s ease}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
.eyebrow{color:var(--ac);font-weight:800;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}
.lead{font-size:1.08rem;color:var(--mu)}
.trust{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--mu);font-size:.9rem}
.trust b{color:var(--tx);font-size:1rem;margin-right:4px}
.verify{font-size:.85rem;color:var(--mu);display:flex;flex-wrap:wrap;gap:2px 14px}
.fl .lt{display:block}
.verify a{color:var(--tx);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.opts{display:grid;gap:10px}
.opt{
  display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:16px 18px;border-radius:16px;
  border:1px solid var(--ln);background:var(--glass);color:var(--tx);font:inherit;cursor:pointer;
  transition:border-color .15s ease,background .15s ease;
}
.opt:hover{border-color:var(--ac)}
.opt .tx{display:grid;gap:2px;flex:1;min-width:0}
.opt b{font-weight:700}
.opt small{color:var(--mu);font-weight:500;font-size:.86rem}
.opt .mark{
  flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;
  font-size:.8rem;font-weight:800;color:transparent;
}
.opt.on{border-color:var(--ac);background:var(--soft)}
.opt.on .mark{background:var(--ac);border-color:var(--ac);color:var(--on)}
.opt .go{flex:none;color:var(--ac);font-weight:800}

.btn{
  display:inline-flex;align-items:center;justify-content:center;text-align:center;gap:8px;width:100%;
  font:inherit;font-weight:800;font-size:1.05rem;color:var(--on);background:var(--ac);border:0;border-radius:16px;
  padding:16px 22px;cursor:pointer;text-decoration:none;box-shadow:0 8px 26px var(--glow);
}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.line{background:transparent;color:var(--tx);border:1px solid var(--ln);box-shadow:none}
input[type=text],input[type=tel]{
  font:inherit;font-size:1.1rem;color:var(--tx);background:var(--glass);border:1px solid var(--ln);border-radius:14px;
  padding:16px;width:100%;min-width:0;
}
.note{font-size:.85rem;color:var(--mu);text-align:center}
.fields{display:grid;gap:14px}
.fl{display:grid;gap:6px;font-weight:700;font-size:.9rem;color:var(--mu)}
.opt-tag{font-weight:500;font-size:.8rem;margin-left:6px}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:.85rem;color:var(--mu);cursor:pointer}
.consent input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--ac)}
.consent a,.note a{color:var(--tx);text-decoration:underline;text-underline-offset:3px}
.err{margin:0;font-size:.85rem;color:var(--tx);font-weight:700}

/* Análisis */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.steps li{display:flex;gap:12px;align-items:center;color:var(--mu);transition:color .3s ease}
.steps .dot{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;font-size:.8rem;font-weight:800;color:transparent}
.steps li.done{color:var(--tx)}
.steps li.done .dot{background:var(--ac);border-color:var(--ac);color:var(--on)}

/* Resultado */
.res{display:grid;gap:18px}
.plan{padding:24px 22px;display:grid;gap:12px;border:1.5px solid var(--ac);box-shadow:0 24px 70px var(--glow),0 14px 44px var(--shadow)}
.plan .name{font-size:clamp(2.2rem,9vw,3rem);font-weight:800;letter-spacing:-.045em;line-height:1}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:.82rem;font-weight:700;padding:5px 12px;border-radius:20px;background:var(--soft);color:var(--ac)}
.blk{padding:22px;display:grid;gap:12px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.list li{position:relative;padding-left:26px;line-height:1.35}
.list li::before{content:"✓";position:absolute;left:0;color:var(--ac);font-weight:800}
.list.plus li::before{content:"+"}
.list li span{display:block;color:var(--mu);font-size:.86rem}
.next{padding:24px 22px;display:grid;gap:14px;border:1.5px solid var(--ac);background:var(--glass2)}
.next .meter{display:grid;gap:6px}
.next .meter .prog{height:8px}
.numline{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:700}
.numline button{font:inherit;font-weight:700;font-size:.85rem;color:var(--tx);background:var(--glass);border:1px solid var(--ln);border-radius:10px;padding:6px 12px;cursor:pointer}
.again{background:none;border:0;color:var(--mu);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;justify-self:center;padding:6px}

.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--glass2);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--ln);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
}
.bar-in{max-width:560px;margin:0 auto}
.bar[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.card{animation:none}.prog i{transition:none}}
.sec{padding:24px 22px;display:grid;gap:16px}
.sec h2{font-size:1.35rem}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{font:inherit;font-weight:700;padding:13px 6px;border-radius:14px;border:1px solid var(--ln);background:var(--glass);color:var(--tx);cursor:pointer;text-align:center;transition:border-color .15s ease,background .15s ease}
.chip:hover{border-color:var(--ac)}
.chip.on{border-color:var(--ac);background:var(--soft);color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{padding:10px 14px;font-size:.92rem}
.svc{display:grid;gap:8px}
.subsel{display:grid;gap:8px;padding:2px 6px 6px}
.subsel .lab{font-size:.85rem;font-weight:700;color:var(--mu)}
.subsel .chips .chip{padding:8px 14px}
.cnt{color:var(--mu);font-size:.9rem;text-align:center}
.reco-why{color:var(--mu);font-size:.95rem}
.sel{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.sel li{position:relative;padding-left:26px;line-height:1.35}
.sel li::before{content:"\2713";position:absolute;left:0;color:var(--ac);font-weight:800}
.sel li span{display:block;color:var(--mu);font-size:.86rem}
.opt-t{font-weight:500;font-size:.85rem;color:var(--mu)}
.bar-flex{display:flex;gap:12px;align-items:center;justify-content:space-between}
.bar-txt{display:grid;line-height:1.2;min-width:0}
.bar-txt b{font-size:1rem}
.bar-txt span{color:var(--mu);font-size:.82rem}
.bar-btn{width:auto;flex:none;padding:14px 20px;font-size:1rem}
</style>

<body>
<div class="shell">
  <div class="top">
    <div class="brand">sergio.creator</div>
    <button class="back" id="back" type="button" hidden>← Atrás</button>
  </div>
  <div class="prog" id="prog" aria-hidden="true"><i id="prog-i"></i></div>
  <main id="stage" aria-live="polite"></main>
</div>

<div class="bar" id="bar" hidden><div class="bar-in bar-flex"><div class="bar-txt"><b id="bar-pack"></b><span id="bar-sub"></span></div><button class="btn bar-btn" id="to-sum" type="button">Ver mi propuesta</button></div></div>

<form name="configurador" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="configurador">
  <input name="bot-field">
  <input name="nombre"><input name="instagram"><input name="whatsapp">
  <input name="tipo"><input name="objetivo"><input name="videos_al_mes"><input name="servicios">
  <input name="pack_recomendado"><input name="origen"><input name="pagina_origen"><input name="consentimiento">
</form>

<script>
(function(){
'use strict';

var WA='34643105522';

var TYPES={creador:'Creador de contenido',marca:'Marca personal',local:'Negocio local'};
var GOALS={
  alcance:'Más alcance y seguidores',
  ventas:'Más clientes y ventas',
  constancia:'Contenido constante sin agobios',
  marca:'Una marca personal reconocible',
  monetizar:'Monetizar mi contenido'
};
var VIDEOS=[4,8,12,16];

var ORDER=['edit','hook','ideas','calls','script','redirect','cover','strategy','metrics','support','rush'];
var FEATS={
  edit:['Edición profesional de vídeo','Cada pieza pulida para retener'],
  hook:['Ganchos que enganchan','Los primeros segundos deciden todo'],
  ideas:['Ideas ganadoras','Temas con potencial real, no al azar'],
  calls:['Acompañamiento 1:1 por videollamada','Resolvemos tu caso en directo'],
  script:['Guiones completos','Tú grabas, yo escribo'],
  redirect:['Redirección de contenido','Reorientamos lo que ya publicas'],
  cover:['Portadas que invitan a pulsar','La primera impresión de cada vídeo'],
  strategy:['Estrategia óptima a 30 días','Un plan claro y priorizado'],
  metrics:['Análisis mensual de métricas','Qué repetir y qué dejar atrás'],
  support:['Soporte por WhatsApp entre llamadas','Tus dudas, resueltas al momento'],
  rush:['Entrega prioritaria en 48 h','Tus vídeos sin esperas']
};
var PF={
  1:['edit','hook','ideas','calls'],
  2:['edit','hook','ideas','calls','script','redirect'],
  3:['edit','hook','ideas','calls','script','redirect','cover','strategy','metrics','support','rush']
};
var PACKS={
  1:{n:'Arranque',d:'La base para publicar con criterio y constancia.'},
  2:{n:'Crecimiento',d:'Más dirección y acompañamiento para crecer con intención.'},
  3:{n:'Escala',d:'El sistema completo: contenido, estrategia y acompañamiento sin dejar nada al azar.'}
};
var PQ={ideas:[10,15,20],calls:[1,3,4]};
var IDEAS_OPTS=[10,15,20];
var CALLS_OPTS=[1,2,3,4];
var REQ_IDEAS={10:1,15:2,20:3};
var REQ_CALLS={1:1,2:2,3:2,4:3};
var REQ_FIXED={edit:1,hook:1,script:2,redirect:2,cover:3,strategy:3,metrics:3,support:3,rush:3};

var S={videos:8,svc:{edit:1,hook:1,ideas:1,calls:1},ideasN:10,callsN:1,tipo:'',goal:'',name:'',ig:'',tel:'',ok:false};
var view='build';
var sent=false;
var waUrlCache='';

function $(id){return document.getElementById(id)}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function igClean(v){return String(v).trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').replace(/^@+/,'').replace(/[\/?#].*$/,'').trim()}
function igOk(v){return /^[A-Za-z0-9._]{1,30}$/.test(igClean(v))}
function telOk(v){var s=String(v).trim();if(!s)return true;var d=s.replace(/\D/g,'');return d.length>=7&&d.length<=15}
function contactOk(){return S.name.trim().length>0&&igOk(S.ig)&&telOk(S.tel)&&S.ok}
function origin(){try{var p=new URLSearchParams(location.search);return p.get('ref')||p.get('utm_source')||'directo'}catch(e){return 'directo'}}
function track(name,props){try{window.plausible(name,props?{props:props}:undefined)}catch(e){}}

function selected(){return ORDER.filter(function(id){return S.svc[id]})}
function reqPack(){
  var p=1;
  selected().forEach(function(id){
    var r=id==='ideas'?REQ_IDEAS[S.ideasN]:id==='calls'?REQ_CALLS[S.callsN]:REQ_FIXED[id];
    if(r>p)p=r;
  });
  return p;
}
function det(id,p){
  var V=S.videos;
  if(id==='edit')return V+' vídeos al mes';
  if(id==='hook')return 'En cada uno de tus '+V+' vídeos';
  if(id==='ideas')return PQ.ideas[p-1]+' ideas al mes';
  if(id==='calls'){var c=PQ.calls[p-1];return c+(c===1?' llamada':' llamadas')+' de 60 min al mes'}
  if(id==='script')return V+' guiones';
  if(id==='cover')return V+' portadas';
  return FEATS[id][1];
}
function nextBumps(p){
  if(p>=3)return [];
  var n=p+1,out=[];
  if(PQ.calls[n-1]!==PQ.calls[p-1])out.push(['Más acompañamiento 1:1','De '+PQ.calls[p-1]+' a '+PQ.calls[n-1]+' llamadas de 60 min al mes']);
  if(PQ.ideas[n-1]!==PQ.ideas[p-1])out.push(['Más ideas ganadoras','De '+PQ.ideas[p-1]+' a '+PQ.ideas[n-1]+' ideas al mes']);
  PF[n].forEach(function(id){if(PF[p].indexOf(id)<0)out.push([FEATS[id][0],det(id,n)])});
  return out;
}

/* ---------- Vistas ---------- */
function svcHTML(id){
  var f=FEATS[id],on=!!S.svc[id],sub='';
  if(id==='ideas'){
    sub='<div class="subsel" data-sub="ideas"'+(on?'':' hidden')+'><span class="lab">Ideas al mes</span><div class="chips">'+
      IDEAS_OPTS.map(function(n){return '<button type="button" class="chip'+(S.ideasN===n?' on':'')+'" data-ideas="'+n+'">'+n+'</button>'}).join('')+'</div></div>';
  }
  if(id==='calls'){
    sub='<div class="subsel" data-sub="calls"'+(on?'':' hidden')+'><span class="lab">Videollamadas de 60 min al mes</span><div class="chips">'+
      CALLS_OPTS.map(function(n){return '<button type="button" class="chip'+(S.callsN===n?' on':'')+'" data-calls="'+n+'">'+n+'</button>'}).join('')+'</div></div>';
  }
  return '<div class="svc"><button class="opt'+(on?' on':'')+'" type="button" data-svc="'+id+'" aria-pressed="'+on+'"><span class="mark">✓</span>'+
    '<span class="tx"><b>'+esc(f[0])+'</b><small>'+esc(f[1])+'</small></span></button>'+sub+'</div>';
}
function trust(){
  return '<ul class="trust"><li><b>545K</b>seguidores en mi antigua marca personal, RojoMoves</li><li><b>+12M</b>seguidores en redes de los influencers con los que trabajo</li><li><b>+8 años</b>de experiencia en creación de contenido y webs</li></ul>'+
    '<p class="verify">Compruébalo tú: <a href="https://www.instagram.com/rojomoves" target="_blank" rel="noopener noreferrer">Instagram</a><a href="https://www.tiktok.com/@rojoviral1" target="_blank" rel="noopener noreferrer">TikTok</a><a href="https://www.youtube.com/@rojomoves" target="_blank" rel="noopener noreferrer">YouTube</a></p>';
}
function buildHTML(){
  var h='<div class="res">'+
    '<section class="card glass"><div><p class="eyebrow">Tu propuesta a medida</p><h1>Monta lo que necesitas</h1>'+
    '<p class="lead" style="margin-top:12px">Elige lo que quieras. Aquí no hay precios: te preparo una propuesta personal después de hablar contigo.</p></div>'+trust()+'</section>'+
    '<section class="sec glass"><h2>¿Cuántos vídeos al mes?</h2><div class="seg" id="vids">'+
    VIDEOS.map(function(n){return '<button type="button" class="chip'+(S.videos===n?' on':'')+'" data-vid="'+n+'">'+n+'</button>'}).join('')+'</div></section>'+
    '<section class="sec glass"><h2>¿Qué quieres incluir?</h2><div class="opts" id="svcs">'+ORDER.map(svcHTML).join('')+'</div></section>'+
    '<section class="sec glass"><h2>Cuéntame un poco más <span class="opt-t">· opcional</span></h2>'+
    '<div class="fields"><div class="fl">¿Qué eres?<div class="chips" id="tipos">'+
    Object.keys(TYPES).map(function(k){return '<button type="button" class="chip'+(S.tipo===k?' on':'')+'" data-tipo="'+k+'">'+esc(TYPES[k])+'</button>'}).join('')+'</div></div>'+
    '<div class="fl">¿Qué quieres conseguir primero?<div class="chips" id="goals">'+
    Object.keys(GOALS).map(function(k){return '<button type="button" class="chip'+(S.goal===k?' on':'')+'" data-goal="'+k+'">'+esc(GOALS[k])+'</button>'}).join('')+'</div></div></div></section>'+
    '</div>';
  return h;
}
function sumHTML(){
  var p=reqPack(),P=PACKS[p],sel=selected(),h='<div class="res">';
  h+='<section class="plan glass"><p class="eyebrow">Pack que te encaja</p><div class="name">'+esc(P.n)+'</div>'+
    '<p class="mu">'+esc(P.d)+'</p><div class="pills"><span class="pill">'+S.videos+' vídeos al mes</span><span class="pill">'+sel.length+(sel.length===1?' servicio elegido':' servicios elegidos')+'</span></div>'+
    '<p class="reco-why">Es el pack más ajustado que cubre todo lo que has elegido.</p></section>';
  h+='<section class="blk glass"><h3>Lo que has elegido</h3><ul class="sel">'+sel.map(function(id){return '<li>'+esc(FEATS[id][0])+'<span>'+esc(det(id,p))+'</span></li>'}).join('')+'</ul></section>';
  var extra=PF[p].filter(function(id){return !S.svc[id]});
  if(extra.length){
    h+='<section class="blk glass"><h3>Y tu pack incluye además</h3><ul class="sel">'+extra.map(function(id){return '<li>'+esc(FEATS[id][0])+'<span>'+esc(det(id,p))+'</span></li>'}).join('')+'</ul></section>';
  }
  var nb=nextBumps(p);
  if(nb.length){
    h+='<section class="blk glass"><h3>Lo que añadiría el pack '+esc(PACKS[p+1].n)+'</h3><ul class="list plus">'+nb.map(function(x){return '<li>'+esc(x[0])+'<span>'+esc(x[1])+'</span></li>'}).join('')+'</ul></section>';
  }
  h+='<section class="next glass"><h3>Recibe tu propuesta personalizada</h3>'+
    '<p class="mu">El precio lo preparo yo tras hablar contigo, ajustado a tu caso. Sin compromiso.</p>'+
    '<div class="fields">'+
    '<label class="fl" for="name">Tu nombre<input id="name" type="text" autocomplete="given-name" maxlength="40" placeholder="Ej. Laura" value="'+esc(S.name)+'"></label>'+
    '<label class="fl" for="ig">Tu usuario de Instagram<input id="ig" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="40" placeholder="@tuusuario" value="'+esc(S.ig)+'"></label>'+
    '<label class="fl" for="tel"><span class="lt">Tu WhatsApp <span class="opt-tag">opcional</span></span><input id="tel" type="tel" autocomplete="tel" maxlength="20" placeholder="+34 600 000 000" value="'+esc(S.tel)+'"></label>'+
    '<label class="consent"><input id="ok" type="checkbox"'+(S.ok?' checked':'')+'><span>Acepto que Sergio use estos datos para contactarme por Instagram o WhatsApp sobre mi propuesta. <a href="privacidad.html" target="_blank" rel="noopener">Más información</a></span></label>'+
    '<p class="err" id="err" role="alert" hidden></p></div>'+
    '<button class="btn" id="send" type="button"'+(contactOk()?'':' disabled')+'>Enviar mi selección por WhatsApp</button>'+
    '<button class="again" type="button" id="edit">Cambiar mi selección</button></section>';
  h+='</div>';
  return h;
}
function loadHTML(){
  return '<section class="card glass"><div><p class="eyebrow">Un momento</p><h2>Estoy armando tu propuesta</h2></div>'+
    '<ul class="steps" id="lsteps"><li><span class="dot">✓</span>Analizando lo que has elegido</li>'+
    '<li><span class="dot">✓</span>Buscando el pack más ajustado</li>'+
    '<li><span class="dot">✓</span>Preparando tu propuesta a medida</li></ul></section>';
}
var loadTok=0;
function runLoad(){
  var tok=++loadTok;
  go('load');
  [450,1100,1750].forEach(function(ms,i){
    setTimeout(function(){
      if(tok!==loadTok||view!=='load')return;
      var li=document.querySelectorAll('#lsteps li')[i];if(li)li.classList.add('done');
    },ms);
  });
  setTimeout(function(){if(tok===loadTok&&view==='load')go('sum')},2400);
}
function sentHTML(){
  return '<section class="card glass"><div><p class="eyebrow">Hecho</p><h2>Gracias, '+esc(S.name.trim())+'</h2></div>'+
    '<p class="lead">Te he abierto WhatsApp con tu selección ya escrita. Solo tienes que pulsar enviar y te respondo yo.</p>'+
    '<a class="btn" href="'+esc(waUrlCache)+'" target="_blank" rel="noopener">Abrir WhatsApp otra vez</a>'+
    '<p class="note">Uso tus datos solo para contactarte sobre tu propuesta. <a href="privacidad.html">Privacidad</a>.</p></section>';
}

/* ---------- Mensaje y envío ---------- */
function summaryLines(){
  var p=reqPack();
  return selected().map(function(id){
    var d=(id==='ideas'||id==='calls')?det(id,p):'';
    return FEATS[id][0]+(d?' ('+d+')':'');
  }).join(', ');
}
function waUrl(){
  var p=reqPack();
  var msg='Hola Sergio, soy '+S.name.trim()+'.\n'+
    'He montado mi propuesta en tu configurador:\n'+
    '- Vídeos al mes: '+S.videos+'\n'+
    '- Quiero: '+summaryLines()+'\n'+
    (S.tipo?'- Soy: '+TYPES[S.tipo]+'\n':'')+
    (S.goal?'- Objetivo: '+GOALS[S.goal]+'\n':'')+
    '- Instagram: @'+igClean(S.ig)+'\n'+(S.tel.trim()?'- WhatsApp: '+S.tel.trim()+'\n':'')+
    '- Origen: '+origin()+'\n'+
    'Pack que me encaja: '+PACKS[p].n+'\n¿Me preparas la propuesta con el presupuesto?';
  return 'https://wa.me/'+WA+'?text='+encodeURIComponent(msg);
}
function sendLead(){
  var p=reqPack();
  var data={
    'form-name':'configurador','bot-field':'',
    nombre:S.name.trim(),instagram:'@'+igClean(S.ig),whatsapp:S.tel.trim(),
    tipo:S.tipo?TYPES[S.tipo]:'',objetivo:S.goal?GOALS[S.goal]:'',videos_al_mes:String(S.videos),
    servicios:summaryLines(),pack_recomendado:PACKS[p].n,origen:origin(),
    pagina_origen:document.referrer||'',consentimiento:'sí'
  };
  var body=Object.keys(data).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(data[k])}).join('&');
  try{
    if(location.protocol!=='http:'&&location.protocol!=='https:')return;
    fetch('/configurador.html',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body}).then(function(r){sent=r.ok}).catch(function(){});
  }catch(e){}
}
function submit(){
  if(!contactOk())return;
  S.ig=igClean(S.ig);
  waUrlCache=waUrl();
  sendLead();
  track('Config Lead',{pack:PACKS[reqPack()].n,origen:origin()});
  try{window.open(waUrlCache,'_blank','noopener')}catch(e){}
  track('Config WhatsApp');
  go('sent');
}

/* ---------- Estado y dibujo ---------- */
function syncBuild(){
  var sel=selected();
  var nodes=document.querySelectorAll('[data-svc]');
  for(var i=0;i<nodes.length;i++){
    var id=nodes[i].getAttribute('data-svc'),on=!!S.svc[id];
    nodes[i].classList.toggle('on',on);nodes[i].setAttribute('aria-pressed',String(on));
  }
  var si=document.querySelector('[data-sub="ideas"]'),sc=document.querySelector('[data-sub="calls"]');
  if(si)si.hidden=!S.svc.ideas;
  if(sc)sc.hidden=!S.svc.calls;
  setOn('[data-vid]','data-vid',S.videos);
  setOn('[data-ideas]','data-ideas',S.ideasN);
  setOn('[data-calls]','data-calls',S.callsN);
  setOn('[data-tipo]','data-tipo',S.tipo);
  setOn('[data-goal]','data-goal',S.goal);
  var btn=$('to-sum'),bp=$('bar-pack'),bs=$('bar-sub');
  if(btn)btn.disabled=!sel.length;
  if(bp)bp.textContent=sel.length?'Pack '+PACKS[reqPack()].n:'Elige un servicio';
  if(bs)bs.textContent=sel.length?(sel.length+(sel.length===1?' servicio':' servicios')+' · '+S.videos+' vídeos al mes'):'Para ver tu propuesta';
}
function setOn(sel,attr,val){
  var nodes=document.querySelectorAll(sel);
  for(var i=0;i<nodes.length;i++){nodes[i].classList.toggle('on',String(nodes[i].getAttribute(attr))===String(val))}
}
function go(v){view=v;draw();try{window.scrollTo(0,0)}catch(e){}}
function draw(){
  var st=$('stage');
  st.innerHTML=view==='build'?buildHTML():view==='load'?loadHTML():view==='sum'?sumHTML():sentHTML();
  $('back').hidden=(view!=='sum');
  $('bar').hidden=(view!=='build');
  document.body.classList.toggle('has-bar',view==='build');
  $('prog-i').style.width=(view==='build'?'25%':view==='load'?'55%':view==='sum'?'78%':'100%');
  if(view==='build')syncBuild();
  if(view==='sum')syncContact();
}
function syncContact(){
  var send=$('send'),err=$('err');
  if(send)send.disabled=!contactOk();
  if(!err)return;
  var msg='';
  if(S.ig.trim()&&!igOk(S.ig))msg='Tu usuario solo puede tener letras, números, puntos y guiones bajos, sin espacios.';
  else if(!telOk(S.tel))msg='Revisa el teléfono: debe tener entre 7 y 15 dígitos.';
  err.textContent=msg;err.hidden=!msg;
}

document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('button'):null;
  if(!t)return;
  if(t.hasAttribute('data-svc')){var id=t.getAttribute('data-svc');if(S.svc[id])delete S.svc[id];else S.svc[id]=1;syncBuild();return}
  if(t.hasAttribute('data-vid')){S.videos=Number(t.getAttribute('data-vid'));syncBuild();return}
  if(t.hasAttribute('data-ideas')){S.ideasN=Number(t.getAttribute('data-ideas'));syncBuild();return}
  if(t.hasAttribute('data-calls')){S.callsN=Number(t.getAttribute('data-calls'));syncBuild();return}
  if(t.hasAttribute('data-tipo')){var k=t.getAttribute('data-tipo');S.tipo=S.tipo===k?'':k;syncBuild();return}
  if(t.hasAttribute('data-goal')){var g=t.getAttribute('data-goal');S.goal=S.goal===g?'':g;syncBuild();return}
  if(t.id==='to-sum'){if(selected().length){track('Config Ver propuesta',{pack:PACKS[reqPack()].n});runLoad()}return}
  if(t.id==='send'){submit();return}
  if(t.id==='edit'||t.id==='back'){go('build');return}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='name')S.name=t.value;
  else if(t.id==='ig')S.ig=t.value;
  else if(t.id==='tel')S.tel=t.value;
  else return;
  syncContact();
});
document.addEventListener('change',function(e){
  if(e.target.id==='ok'){S.ok=e.target.checked;syncContact()}
});
draw();
})();

</script>
</body>
</html>
